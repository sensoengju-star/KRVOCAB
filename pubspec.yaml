name: maldari
description: Maldari — Korean vocabulary flashcards with a local Gemma model.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.2.1
  shared_preferences: ^2.2.3
  share_plus: ^9.0.0
  path_provider: ^2.1.3
  flutter_tts: ^4.0.2
  audioplayers: ^6.8.1
  crypto: ^3.0.3
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.6
  window_manager: ^0.5.2
  tray_manager: ^0.5.3
  launch_at_startup: ^0.5.1

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    # The tray icon. Bundled rather than read from windows/runner/resources,
    # because that path is relative to the working directory and only exists
    # in a dev checkout.
    - assets/tray_icon.ico
